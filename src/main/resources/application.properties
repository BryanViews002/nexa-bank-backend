spring.application.name=bank
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bank_app?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

spring.task.scheduling.pool.size=5
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.security.otp-pepper=${OTP_PEPPER:local-development-only-change-me}
app.security.card-pepper=${CARD_PEPPER:local-development-only-change-me}
app.security.otp-cleanup-ms=60000
app.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:local-sandbox-webhook-secret}
app.scheduler.recurring-payment-delay-ms=60000
app.scheduler.savings-goal-delay-ms=60000
app.scheduler.payment-request-delay-ms=300000
app.scheduler.loan-delay-ms=300000
app.fx.spread=0.005
